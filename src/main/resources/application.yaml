
server:
  port: 8081

spring:
  application:
    name: api-sentinel

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sentinel}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:YourPassword}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
  
  logging:
  level:
    root: INFO
    com.apisentinel: DEBUG
  pattern:
    level: "%5p [monitorId=%X{monitorId:-}]"

sentinel:
  mock:
    enabled: true
  scheduler:
    enabled: true
    tick-ms: 5000
    batch-size: 50
    worker-threads: 10
    queue-capacity: 100

