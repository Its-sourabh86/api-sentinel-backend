
server:
  port: 8081

spring:
  application:
    name: api-sentinel

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sentinel}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
  
  logging:
  level:
    root: INFO
    com.apisentinel: DEBUG
  pattern:
    level: "%5p [monitorId=%X{monitorId:-}]"

